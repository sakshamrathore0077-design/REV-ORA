function useAsync(fn, deps) {
  const [state, setState] = useState({ loading: true, data: null, error: null });
  useEffect(() => {
    let alive = true;
    setState({ loading: true, data: null, error: null });
    Promise.resolve(fn())
      .then(data => alive && setState({ loading: false, data, error: null }))
      .catch(err => alive && setState({ loading: false, data: null, error: err }));
    return () => { alive = false; };
  }, deps);
  return state;
}
function useSEO({ title, description } = {}) {
  useEffect(() => {

    let el = document.head.querySelector('meta[name="description"]');
    if (!el) { el = document.createElement('meta'); el.setAttribute('name','description'); document.head.appendChild(el); }
    el.setAttribute('content', description || DEFAULT_DESCRIPTION);
  }, [title, description]);
}

const RouterContext = createContext({ path: '/', query: new URLSearchParams() });
function parseHash() {
  const raw = window.location.hash.replace(/^#/, '') || '/';
  const [path, qs] = raw.split('?');
  return { path: path || '/', query: new URLSearchParams(qs || '') };
}
function navigate(to) { window.location.hash = to; }
function Link({ to, children, className, onClick, ariaLabel, ...rest }) {
  return <a href={'#' + to} className={className} onClick={onClick} aria-label={ariaLabel} {...rest}>{children}</a>;
}
function RouterProvider({ children }) {
  const [route, setRoute] = useState(parseHash);
  useEffect(() => {
    const onChange = () => { setRoute(parseHash()); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', onChange);
    return () => window.removeEventListener('hashchange', onChange);
  }, []);
  return <RouterContext.Provider value={route}>{children}</RouterContext.Provider>;
}
const useRoute = () => useContext(RouterContext);

/* ================= TOAST =================
   Non-blocking confirmation shown for a few seconds
   (e.g. after Buy Now: "Order confirmed — opening Instagram DM…") */
const ToastContext = createContext({ notify: () => {} });
const useToast = () => useContext(ToastContext);
function ToastProvider({ children }) {
  const [toast, setToast] = useState(null);
  const timer = useRef(null);
  const notify = (msg) => {
    setToast(msg);
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(() => setToast(null), 5000);
  };
  return (
    <ToastContext.Provider value={{ notify }}>
      {children}
      {toast && (
        <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-[80] w-[calc(100%-2rem)] max-w-sm bg-cocoa text-ivory rounded-2xl px-5 py-4 shadow-xl fade-up text-sm leading-relaxed" role="status" aria-live="polite">

            <IconSparkle className="w-4 h-4 text-gold shrink-0 mt-0.5"/>
            <span>{toast}</span>
          </span>
        </div>
      )}
    </ToastContext.Provider>
  );
}

/* ================= CART =================
   One add = one piece. Stacks on repeat taps.
   Persists in localStorage. DM to Buy = direct redirect. */
const CartContext = createContext(null);
const useCart = () => useContext(CartContext);
function CartProvider({ children }) {
  const [open, setOpen] = useState(false);
  const [raw, setRaw] = useState(() => {
    try { return JSON.parse(localStorage.getItem('reviora_cart') || '[]'); } catch (e) { return []; }
  });
  useEffect(() => {
    try { localStorage.setItem('reviora_cart', JSON.stringify(raw)); } catch (e) {}
  }, [raw]);
  const items = useMemo(() => raw.map(r => {
    const p = PRODUCTS.find(pp => pp.id === r.id);
    return p ? { ...p, qty: r.qty } : null;
  }).filter(Boolean), [raw]);
  const count = items.reduce((s, it) => s + it.qty, 0);
  const total = items.reduce((s, it) => s + it.price * it.qty, 0);
  const addToCart = (product) => {
    if (!isProductAvailable(product)) return;
    Analytics.track('add_to_cart', { sku: product.sku });
    setRaw(prev => {
      const found = prev.find(i => i.id === product.id);
      if (found) return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
      return [...prev, { id: product.id, qty: 1 }];
    });
    setOpen(true);
  };
  const removeFromCart = (id) => setRaw(prev => prev.filter(i => i.id !== id));
  const clearCart = () => setRaw([]);
  return (
    <CartContext.Provider value={{ items, count, total, addToCart, removeFromCart, clearCart, open, setOpen }}>
      {children}
      <CartDrawer/>
    </CartContext.Provider>
  );
}

    window.addEventListener('keydown', onKey);
    return () => { document.body.style.overflow = ''; window.removeEventListener('keydown', onKey); };
  }, [open, setOpen]);

  /* One tap: confirmation toast with full order summary → straight to the DM thread */
  const dmBuy = () => {

        </div>
        {items.length === 0 ? (
          <div className="flex-1 flex flex-col items-center justify-center text-center px-6 gap-3">
            <IconSparkle className="w-6 h-6 text-gold"/>
            <p className="serif text-2xl">Your cart is empty.</p>
            <p className="text-sm text-cocoa/65">Add pieces you love — then DM us to order.</p>
            <Btn to="/shop" onClick={() => setOpen(false)}>Shop the Collection</Btn>
          </div>
        ) : (
          <>
            <div className="flex-1 overflow-y-auto px-4 py-2 divide-y divide-beige/50">
              {items.map(item => (
                <div key={item.id} className="flex items-center gap-3 py-3.5">
                  <span className="block w-14 h-16 rounded-lg overflow-hidden border border-beige/70 shrink-0 bg-white">
                    <ProductImage product={item}/>
                  </span>

function Reveal({ children, delay = 0, className = '' }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { el.classList.add('is-visible'); obs.disconnect(); }
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return <div ref={ref} className={cx('reveal', className)} style={{ transitionDelay: `${delay}ms` }}>{children}</div>;
}

/* ================= Scroll-scrub hero animation (30 frames) ================= */
const HERO_FRAME_PATHS = Array.from({ length: 30 }, (_, i) =>
  `./assets/frames/ezgif-frame-${String(i + 1).padStart(3, '0')}.jpg`);

function HeroScrub() {
  const [frames, setFrames] = useState(null);
  const [idx, setIdx] = useState(0);
  const wrapRef = useRef(null);

  useEffect(() => {
    let alive = true;
    Promise.all(HERO_FRAME_PATHS.map(src => new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(src);
      img.onerror = () => resolve(null);
      img.src = src;
    }))).then(list => {
      if (alive) setFrames(list.filter(Boolean));
    });
    return () => { alive = false; };
  }, []);

  useEffect(() => {
    if (!frames || frames.length === 0) return;
    const onScroll = () => {
      const el = wrapRef.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      const p = Math.min(1, Math.max(0, (-r.top) / (r.height * 0.9)));
      setIdx(Math.min(frames.length - 1, Math.floor(p * frames.length)));
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, [frames]);

  if (!frames || frames.length === 0) return null;
  return (
    <div className="hero-scrub-wrap" ref={wrapRef} aria-hidden="true">
      {frames.map((src, i) => (
        <img key={src} src={src} alt="" decoding="async"
          className="hero-scrub-img" style={{ opacity: i === idx ? 1 : 0 }} />
      ))}
    </div>
  );
}

      <Link to={`/product/${product.slug}`} className="block relative overflow-hidden rounded-2xl bg-ivory border border-beige/60 hover:border-gold/50 hover:shadow-lg hover:shadow-gold/10 transition-all duration-300" ariaLabel={`View ${product.name}`}>
        <div className="aspect-[4/5] overflow-hidden zoom-hover">
          <div className={cx('w-full h-full', soldOut && 'opacity-60 saturate-50')}>
            <ProductImage product={product}/>
          </div>
        </div>
        <div className="absolute top-3 left-3 flex flex-col gap-1.5">
          {product.newArrival && !soldOut && <Badge tone="gold">New</Badge>}
          {product.bestseller && !soldOut && <Badge tone="cocoa">Bestseller</Badge>}
        </div>
        {soldOut && (
          <div className="absolute inset-0 flex items-center justify-center bg-ivory/50">
            <span className="bg-cocoa/90 text-ivory text-[10px] font-bold tracking-[0.25em] uppercase px-4 py-2 rounded-full">Sold Out</span>

        <h3 className="serif text-lg leading-snug mt-1">

/* ================= search ================= */
function SearchOverlay({ open, onClose }) {
  const { products, loading } = useCatalog();
  const [q, setQ] = useState('');
  const inputRef = useRef(null);
  useEffect(() => {
    if (open) { document.body.style.overflow = 'hidden'; setTimeout(() => inputRef.current?.focus(), 60); }
    else { document.body.style.overflow = ''; setQ(''); }
    return () => { document.body.style.overflow = ''; };
  }, [open]);
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  const results = useMemo(() => {
    if (!q.trim() || loading) return [];
    return products.filter(p => matchesQuery(p, q)).slice(0, 8);
  }, [q, products, loading]);
  const total = useMemo(() => products.filter(p => matchesQuery(p, q)).length, [q, products]);
  if (!open) return null;
  const viewAll = () => { Analytics.track('search', { query: q }); navigate('/shop?q=' + encodeURIComponent(q.trim())); onClose(); };
  return (
    <div className="fixed inset-0 z-[60] bg-cream/95 backdrop-blur-md overflow-y-auto" role="dialog" aria-modal="true" aria-label="Search products">
      <div className="max-w-2xl mx-auto px-4 pt-6 md:pt-16 pb-16">
        <div className="flex items-center gap-3">
          <div className="flex-1 flex items-center gap-3 bg-white border border-beige rounded-full px-5 py-3.5 focus-within:border-gold focus-within:shadow-lg focus-within:shadow-gold/10 transition-all">
            <IconSearch className="w-4 h-4 text-gold shrink-0"/>
            <input ref={inputRef} value={q} onChange={e => setQ(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && q.trim()) viewAll(); }}
              placeholder="Search pieces, SKUs, categories…"
              className="flex-1 bg-transparent outline-none text-sm placeholder:text-cocoa/40" aria-label="Search products"/>
          </div>
          <button onClick={onClose} aria-label="Close search" className="p-3 rounded-full bg-white border border-beige hover:border-gold transition-colors"><IconClose/></button>
        </div>
        {q.trim() && (
          <div className="mt-6">
            {results.length === 0 ? (
              <EmptyState title="No pieces found." subtitle={`Nothing matches “${q.trim()}”.`}/>
            ) : (
              <>
                <ul className="divide-y divide-beige/50">
                  {results.map(p => (
                    <li key={p.id}>
                      <Link to={`/product/${p.slug}`} onClick={onClose} className="flex items-center gap-4 py-3.5 group">
                        <span className="block w-12 h-14 rounded-lg overflow-hidden border border-beige/70 shrink-0 bg-white"><ProductImage product={p}/></span>
                        <span className="flex-1 min-w-0">
                          <span className="serif text-lg block truncate group-hover:text-gold transition-colors">{p.name}</span>
                          <span className="text-[10px] tracking-[0.2em] uppercase text-cocoa/50">{p.sku} · {p.category}</span>
                        </span>
                        <span className="text-sm shrink-0">{formatPrice(p.price)}</span>
                      </Link>
                    </li>
                  ))}
                </ul>
                {total > results.length && (
                  <div className="mt-5 text-center"><Btn variant="outline" size="sm" onClick={viewAll}>View all {total} results</Btn></div>
                )}
              </>
            )}
          </div>
        )}
        {!q.trim() && <p className="mt-10 text-center text-xs tracking-[0.2em] uppercase text-cocoa/45">Search by name · SKU · category</p>}
      </div>
    </div>
  );
}

const PRICE_RANGES = [
  { id: 'all', label: 'All prices', test: () => true },
  { id: 'under200', label: 'Under ₹200', test: p => p.price < 200 },
  { id: '200to300', label: '₹200 – ₹299', test: p => p.price >= 200 && p.price < 300 },
  { id: 'above300', label: '₹300 +', test: p => p.price >= 300 },
];
const SORTS = [
  { id: 'featured', label: 'Featured' },
  { id: 'newest', label: 'Newest' },
  { id: 'price-asc', label: 'Price: Low to High' },
  { id: 'price-desc', label: 'Price: High to Low' },
  { id: 'alpha', label: 'Alphabetical' },
];
function ProductFilters({ filters, setFilters, products }) {
  const countFor = (catName) => products.filter(p => p.category === catName).length;
  const check = 'accent-[#A68A5B] w-3.5 h-3.5';
  const label = 'text-xs text-cocoa/80 hover:text-cocoa cursor-pointer';
  const section = 'mb-7';
  const head = 'text-[10px] font-bold tracking-[0.3em] uppercase text-cocoa mb-3.5';
  return (
    <div>
      <div className={section}>
        <p className={head}>Category</p>
        <div className="space-y-2.5">
          {PRODUCT_CATEGORIES.map(c => (
            <label key={c.slug} className="flex items-center gap-2.5">
              <input type="checkbox" className={check}
                checked={filters.categories.includes(c.name)}
                onChange={e => setFilters(f => ({ ...f, categories: e.target.checked ? [...f.categories, c.name] : f.categories.filter(x => x !== c.name) }))}/>
              <span className={label}>{c.name} <span className="text-cocoa/40">({countFor(c.name)})</span></span>
            </label>
          ))}
        </div>
      </div>
      <div className={section}>
        <p className={head}>Price</p>
        <div className="space-y-2.5">
          {PRICE_RANGES.map(r => (
            <label key={r.id} className="flex items-center gap-2.5">
              <input type="radio" name="price" className={check} checked={filters.price === r.id} onChange={() => setFilters(f => ({ ...f, price: r.id }))}/>
              <span className={label}>{r.label}</span>
            </label>
          ))}
        </div>
      </div>
      <div className={section}>
        <p className={head}>Collection</p>
        <div className="space-y-2.5">
          <label className="flex items-center gap-2.5">
            <input type="checkbox" className={check} checked={filters.newArrivals} onChange={e => setFilters(f => ({ ...f, newArrivals: e.target.checked }))}/>
            <span className={label}>New Arrivals</span>
          </label>
          <label className="flex items-center gap-2.5">
            <input type="checkbox" className={check} checked={filters.bestsellers} onChange={e => setFilters(f => ({ ...f, bestsellers: e.target.checked }))}/>
            <span className={label}>Best Sellers</span>
          </label>
          <label className="flex items-center gap-2.5">
            <input type="checkbox" className={check} checked={filters.inStockOnly} onChange={e => setFilters(f => ({ ...f, inStockOnly: e.target.checked }))}/>
            <span className={label}>In stock only</span>
          </label>
        </div>
      </div>
      <button onClick={() => setFilters(f => ({ ...f, categories: [], price: 'all', newArrivals: false, bestsellers: false, inStockOnly: false, q: '' }))}
        className="text-[10px] font-semibold tracking-[0.2em] uppercase text-gold hover:text-cocoa underline underline-offset-4">
        Clear all filters
      </button>
    </div>
  );
}
function Shop({ preset = null }) {
  const route = useRoute();
  const { products, loading, error } = useCatalog();
  const [showFilters, setShowFilters] = useState(false);
  const [filters, setFilters] = useState(() => ({
    categories: preset && preset.type === 'product' ? [preset.name] : [],
    price: 'all', inStockOnly: false, newArrivals: false, bestsellers: false,
    q: route.query.get('q') || '', sort: 'featured',
  }));
  const title = preset ? preset.name : 'Shop All';
  const subtitle = preset ? preset.description : 'Every Reviora piece, in one place. Find your next favourite.';
  useSEO({ title, description: subtitle });
  useEffect(() => { Analytics.track(preset ? 'category_view' : 'page_view', { page: 'shop', category: preset?.name }); }, [preset]);
  const filtered = useMemo(() => {
    const range = PRICE_RANGES.find(r => r.id === filters.price) || PRICE_RANGES[0];
    let list = products.filter(p =>
      (!filters.categories.length || filters.categories.includes(p.category)) &&
      range.test(p) &&
      (!filters.inStockOnly || isProductAvailable(p)) &&
      (!filters.newArrivals || p.newArrival) &&
      (!filters.bestsellers || p.bestseller) &&
      matchesQuery(p, filters.q)
    );
    const sorters = {
      'featured': (a, b) => (b.featured - a.featured) || (b.bestseller - a.bestseller) || a.name.localeCompare(b.name),
      'newest': (a, b) => b.createdAt.localeCompare(a.createdAt),
      'price-asc': (a, b) => a.price - b.price,
      'price-desc': (a, b) => b.price - a.price,
      'alpha': (a, b) => a.name.localeCompare(b.name),
    };
    return [...list].sort(sorters[filters.sort] || sorters.featured);
  }, [products, filters]);
  const activeChips = [
    ...filters.categories.map(c => ({ label: c, clear: () => setFilters(f => ({ ...f, categories: f.categories.filter(x => x !== c) })) })),
    ...(filters.price !== 'all' ? [{ label: PRICE_RANGES.find(r => r.id === filters.price).label, clear: () => setFilters(f => ({ ...f, price: 'all' })) }] : []),
    ...(filters.newArrivals ? [{ label: 'New', clear: () => setFilters(f => ({ ...f, newArrivals: false })) }] : []),
    ...(filters.bestsellers ? [{ label: 'Bestseller', clear: () => setFilters(f => ({ ...f, bestsellers: false })) }] : []),
    ...(filters.inStockOnly ? [{ label: 'In stock', clear: () => setFilters(f => ({ ...f, inStockOnly: false })) }] : []),
    ...(filters.q ? [{ label: `“${filters.q}”`, clear: () => setFilters(f => ({ ...f, q: '' })) }] : []),
  ];
  return (
    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-10 md:pt-14 pb-8">
      <Reveal>
        <header className="text-center fade-up">
          <p className="text-[10px] font-semibold tracking-[0.35em] uppercase text-gold flex items-center justify-center gap-2"><IconSparkle className="w-2.5 h-2.5"/>{preset ? 'Collection' : 'The Catalogue'}</p>
          <h1 className="serif text-4xl md:text-5xl mt-3">{title}</h1>
          <SparkleDivider className="mt-5"/>
          <p className="mt-4 text-sm text-cocoa/70 max-w-xl mx-auto">{subtitle}</p>
        </header>
      </Reveal>
      <div className="mt-10 grid lg:grid-cols-[240px_1fr] gap-8 lg:gap-12">
        <aside className="hidden lg:block">
          <div className="sticky top-24">
            <ProductFilters filters={filters} setFilters={setFilters} products={products}/>
          </div>
        </aside>
        <div>
          <div className="flex flex-wrap items-center gap-3 justify-between">
            <button onClick={() => setShowFilters(s => !s)} aria-expanded={showFilters}
              className="lg:hidden inline-flex items-center gap-2 border border-beige rounded-full px-5 py-2.5 text-[10px] font-semibold tracking-[0.2em] uppercase hover:border-gold transition-colors bg-white">
              Filters {activeChips.length > 0 && <span className="w-4 h-4 rounded-full bg-gold text-ivory text-[8px] flex items-center justify-center">{activeChips.length}</span>}
            </button>
            <label className="inline-flex items-center gap-2 ml-auto">
              <span className="text-[10px] tracking-[0.2em] uppercase text-cocoa/50 hidden sm:inline">Sort</span>
              <select value={filters.sort} onChange={e => setFilters(f => ({ ...f, sort: e.target.value }))}
                className="bg-white border border-beige rounded-full px-4 py-2.5 text-[11px] tracking-wide outline-none focus:border-gold cursor-pointer transition-colors"
                aria-label="Sort products">
                {SORTS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
              </select>
            </label>
          </div>
          {showFilters && (
            <div className="lg:hidden mt-4 rounded-2xl border border-beige bg-white p-5 fade-up">
              <ProductFilters filters={filters} setFilters={setFilters} products={products}/>
            </div>
          )}
          {activeChips.length > 0 && (
            <div className="flex flex-wrap gap-2 mt-4">
              {activeChips.map(chip => (
                <button key={chip.label} onClick={chip.clear}
                  className="inline-flex items-center gap-1.5 bg-beige/50 border border-beige rounded-full px-3.5 py-1.5 text-[10px] tracking-[0.15em] uppercase hover:border-gold transition-colors">
                  {chip.label} <IconClose className="w-3 h-3"/>
                </button>
              ))}
            </div>
          )}
          <div className="mt-7">
            {error ? <ErrorState/> : loading ? (
              <div className="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">{Array.from({length:6}).map((_,i)=><SkeletonCard key={i}/>)}</div>
            ) : filtered.length === 0 ? (
              <EmptyState title="No pieces found." subtitle="Try another category or clear your filters."
                action={<Btn variant="outline" size="sm" onClick={() => setFilters(f => ({ ...f, categories: [], price: 'all', newArrivals: false, bestsellers: false, inStockOnly: false, q: '' }))}>Clear Filters</Btn>}/>
            ) : (
              <div className="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">
                {filtered.map(p => <ProductCard key={p.id} product={p}/>)}
              </div>
            )}
          </div>
        </div>
      </div>
    </main>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) {
      return (
        <div className="min-h-screen flex items-center justify-center px-4 text-center">
          <div>
            <IconSparkle className="w-6 h-6 text-gold mx-auto"/>
            <h1 className="serif text-3xl mt-4">Something went wrong.</h1>
            <p className="text-sm text-cocoa/60 mt-2">Please refresh the page and try again.</p>
            <div className="mt-6"><Btn onClick={() => window.location.reload()}>Refresh</Btn></div>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}
function App() {
  const route = useRoute();
  const [searchOpen, setSearchOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  useEffect(() => { setSearchOpen(false); setMenuOpen(false); }, [route.path]);
  useEffect(() => {
    const onKey = (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      if (e.key === '/' && tag !== 'input' && tag !== 'textarea') { e.preventDefault(); setSearchOpen(true); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  const seg = route.path.split('/').filter(Boolean);
  let page;
  if (seg.length === 0) page = <Home/>;
  else if (seg[0] === 'shop') page = <Shop/>;
  else if (seg[0] === 'category' && seg[1]) page = <CategoryPage slug={seg[1]}/>;
  else if (seg[0] === 'product' && seg[1]) page = <ProductPage slug={seg[1]}/>;
  else if (seg[0] === 'about') page = <About/>;
  else if (seg[0] === 'faq') page = <FAQ/>;
  else if (seg[0] === 'shipping') page = <Shipping/>;
  else if (seg[0] === 'returns') page = <Returns/>;
  else if (seg[0] === 'care') page = <Care/>;
  else if (seg[0] === 'contact') page = <Contact/>;
  else if (seg[0] === 'terms') page = <Terms/>;
  else page = <NotFound/>;
  return (
    <div className="min-h-screen flex flex-col">
      <Header searchOpen={searchOpen} setSearchOpen={setSearchOpen} menuOpen={menuOpen} setMenuOpen={setMenuOpen}/>
      <div className="flex-1">{page}</div>
      <Footer/>
      <MenuDrawer open={menuOpen} onClose={() => setMenuOpen(false)}/>
      <SearchOverlay open={searchOpen} onClose={() => setSearchOpen(false)}/>
      <FloatingInstagram/>
    </div>
  );
}
const Root = () => (
  <ErrorBoundary>
    <RouterProvider>
      <CatalogProvider>
        <ToastProvider>
          <BuyNowProvider>
            <CartProvider>
              <App/>
            </CartProvider>
          </BuyNowProvider>
        </ToastProvider>
      </CatalogProvider>
    </RouterProvider>
  </ErrorBoundary>
);
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);

<!-- ==================== ROBUST CDN LOADER (3-CDN fallback) ==================== -->
<script>
(function () {
  var REACT = [
    'https://unpkg.com/react@18.3.1/umd/react.production.min.js',
    'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js'
  ];
  var REACT_DOM = [
    'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js',
    'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js'
  ];
  var BABEL = [
    'https://unpkg.com/@babel/standalone@7.24.7/babel.min.js',
    'https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js'
  ];
  var TAILWIND = ['https://cdn.tailwindcss.com/3.4.16'];

  function loadScript(urls, onDone) {
    var i = 0;
    (function next() {
      if (i >= urls.length) return onDone(false);
      var s = document.createElement('script');
      s.src = urls[i++];
      s.onload = function () { onDone(true); };
      s.onerror = next;
      document.head.appendChild(s);
    })();
  }

  function showBootError() {
    var ld = document.getElementById('boot-loading');
    var el = document.getElementById('boot-error');
    if (ld) ld.style.display = 'none';
    if (el) el.style.display = 'flex';
  }

  loadScript(TAILWIND, function (okTw) {
    if (okTw && window.tailwind) {
      tailwind.config = { theme: { extend: {
        colors: { cream: '#F6EFE5', ivory: '#FFFDF9', cocoa: '#4A3B2A', gold: '#A68A5B', beige: '#DCCBB4' },
        fontFamily: { serif: ['"Cormorant Garamond"', 'serif'], sans: ['Manrope', 'sans-serif'] }
      } } };
    }
    loadScript(REACT, function (okR) {
      if (!okR) return showBootError();
      loadScript(REACT_DOM, function (okD) {
        if (!okD) return showBootError();
        loadScript(BABEL, function (okB) {
          if (!okB) return showBootError();
          try {
            var src = document.getElementById('reviora-app').textContent;
            var compiled = Babel.transform(src, { presets: ['react'] }).code;
            var runner = document.createElement('script');
            runner.text = compiled;
            document.body.appendChild(runner);
            var ld = document.getElementById('boot-loading');
            if (ld) ld.remove();
          } catch (e) {
            console.error(e);
            showBootError();
          }
        });
      });
    });
  });
})();
</script>
